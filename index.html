<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6455a5"><title>Manausprev • Meu Plano</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#27243b;background:#f7f5fb}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#51418e,#8474c3);color:white;padding:25px 18px 30px}main{max-width:760px;margin:-12px auto 40px;padding:0 14px}.card{background:white;border:1px solid #e9e4f0;border-radius:18px;padding:18px;margin:13px 0;box-shadow:0 3px 14px #3025520b}h1{margin:0;font-size:25px}h2{font-size:19px;margin:0 0 12px}p{line-height:1.55}small,.muted{color:#6b6780}header small{color:#e5dfff}button,a.btn{border:0;border-radius:12px;padding:12px 15px;font-size:15px;font-weight:650;cursor:pointer;background:#6251a4;color:white;text-decoration:none;display:inline-block}button.alt{background:#efecf7;color:#4c3c85}button:disabled{opacity:.5}.nav{display:flex;gap:7px;overflow:auto;padding:10px 0}.nav button{white-space:nowrap}.nav button.active{background:#342866}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#f4f1fa;border-radius:12px;padding:12px}.stat strong{font-size:23px}.choice{display:block;width:100%;text-align:left;margin:8px 0;background:#f5f2fa;color:#29233e;border:1px solid #e6e0f1}.choice.selected{border:2px solid #6251a4;background:#eae4f8}.correct{background:#e8f6ef!important;border-color:#2b9b67!important}.wrong{background:#fff0ef!important;border-color:#d36b66!important}.pill{font-size:12px;background:#eee9f9;color:#54468a;border-radius:30px;padding:5px 10px}.bar{height:10px;background:#eeeaf4;border-radius:30px;overflow:hidden}.bar div{height:100%;background:#7864bf}input,select{padding:11px;border:1px solid #dcd5eb;border-radius:10px;font-size:15px;max-width:100%}li{margin:9px 0}footer{text-align:center;color:#777187;font-size:12px;padding:20px} .hidden{display:none} .note{border-left:3px solid #9a8acc;padding-left:12px}a{color:#51418e}</style></head><body><header><div style="max-width:760px;margin:auto"><small>SEU ESPAÇO DE PREPARAÇÃO • FCC</small><h1>Manausprev ✦ Meu Plano</h1><p style="margin-bottom:0">Um passo possível hoje. Um aprendizado que fica amanhã.</p></div></header><main><nav class="nav" id="nav"></nav><section id="screen"></section><footer>Preparação independente • Não afiliado à Manausprev, FCC ou Gran Cursos. Dados armazenados neste navegador.</footer></main><script>
const KEY='manausprev_v1';const defaults={answers:[],reviews:[],energy:'baixa',lastTopic:0,completed:0,plan:[],studyDays:[],granLink:'https://www.grancursosonline.com.br/',goal:45};let state;try{state={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state={...defaults}}let page='inicio',qi=0,selected=-1,shown=false;const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const topics=[['Direito Administrativo','Princípios da Administração Pública'],['Direito Constitucional','Art. 37 e administração pública'],['Direito Previdenciário','Regimes de previdência e RPPS'],['Língua Portuguesa','Interpretação de texto'],['Raciocínio Lógico','Porcentagens'],['Informática','Segurança da informação'],['Direito Civil','Pessoas naturais e capacidade']];const questions=[{t:0,q:'Um servidor favorece um amigo na ordem de atendimento, sem justificativa legal. O princípio mais diretamente violado é:',o:['Publicidade','Eficiência','Impessoalidade','Continuidade','Especialidade'],a:2,e:'Impessoalidade impede favorecimentos pessoais indevidos. A amizade não é critério legítimo para antecipar atendimento.'},{t:0,q:'Uma repartição reorganiza o fluxo de processos para reduzir atrasos e desperdício. O princípio mais diretamente relacionado é:',o:['Legalidade','Eficiência','Publicidade','Impessoalidade','Moralidade'],a:1,e:'Eficiência envolve qualidade, produtividade e bom uso dos recursos.'},{t:0,q:'Uma campanha oficial utiliza a fotografia de um dirigente para promover sua imagem pessoal. Qual princípio é violado mais diretamente?',o:['Impessoalidade','Eficiência','Publicidade exclusivamente','Continuidade','Hierarquia'],a:0,e:'O art. 37, §1º, da Constituição veda promoção pessoal em publicidade institucional.'},{t:0,q:'A Administração cria uma cobrança sem fundamento legal. Qual princípio é mais diretamente atingido?',o:['Publicidade','Legalidade','Eficiência','Impessoalidade','Motivação'],a:1,e:'A atuação administrativa precisa de fundamento jurídico; cobranças não podem ser inventadas pelo gestor.'},{t:1,q:'Qual conjunto corresponde aos princípios expressos no caput do art. 37 da Constituição?',o:['Legalidade, pessoalidade, moralidade, publicidade, eficiência','Legalidade, impessoalidade, moralidade, publicidade, eficiência','Legalidade, impessoalidade, moralidade, sigilo, eficiência','Legalidade, moralidade, hierarquia, publicidade, eficiência','Legalidade, publicidade, especialidade, hierarquia, eficiência'],a:1,e:'LIMPE: Legalidade, Impessoalidade, Moralidade, Publicidade e Eficiência.'},{t:2,q:'O Regime Próprio de Previdência Social (RPPS) destina-se, em regra, a:',o:['Todos os trabalhadores da iniciativa privada','Servidores públicos titulares de cargos efetivos dos entes que instituíram RPPS','Somente trabalhadores autônomos','Todos os ocupantes de cargo em comissão, sem exceção','Exclusivamente militares das Forças Armadas'],a:1,e:'O RPPS é voltado aos servidores titulares de cargos efetivos vinculados a entes que o instituíram, observadas as normas constitucionais.'},{t:3,q:'Em um texto argumentativo, a tese é:',o:['A ideia central defendida pelo autor','Qualquer exemplo citado','O título obrigatório','A conclusão de um parágrafo isolado','Uma informação necessariamente numérica'],a:0,e:'A tese é a posição central defendida pelo autor, sustentada por argumentos.'},{t:4,q:'Uma quantidade passa de 80 para 100. O aumento percentual é:',o:['20%','25%','80%','100%','125%'],a:1,e:'Aumento de 20 sobre base 80: 20/80 = 0,25 = 25%.'},{t:5,q:'Uma mensagem falsa que tenta obter senhas por meio de um link é exemplo de:',o:['Backup','Phishing','Criptografia','Compactação','Firewall'],a:1,e:'Phishing é fraude que tenta induzir a vítima a revelar dados ou acessar páginas maliciosas.'},{t:6,q:'Segundo o Código Civil, a personalidade civil da pessoa começa:',o:['Na concepção, sem ressalvas','No nascimento com vida, resguardados desde a concepção os direitos do nascituro','Aos 16 anos','Aos 18 anos','Com o registro eleitoral'],a:1,e:'Art. 2º do Código Civil: a personalidade civil começa do nascimento com vida; a lei põe a salvo, desde a concepção, os direitos do nascituro.'}];const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function setPage(p){page=p;selected=-1;shown=false;render();window.scrollTo(0,0)}function markStudy(){let d=new Date().toISOString().slice(0,10);if(!state.studyDays.includes(d))state.studyDays.push(d);save()}function header(t,s=''){return `<div class="card"><h2>${t}</h2>${s?`<p class="muted">${s}</p>`:''}</div>`}function render(){const names=[['inicio','Início'],['estudar','Estudar'],['questoes','Questões'],['revisar','Revisões'],['edital','Edital'],['progresso','Progresso']];$('nav').innerHTML=names.map(([k,v])=>`<button class="${page===k?'active':'alt'}" onclick="setPage('${k}')">${v}</button>`).join('');let h='';if(page==='inicio'){let d=Math.max(0,Math.ceil((new Date('2026-12-06T12:00:00-04:00')-new Date())/86400000));h=`<div class="card"><div class="row"><h2>Seu próximo passo</h2><span class="pill">${d} dias até a prova</span></div><p>Como está sua energia agora?</p><div class="grid">${[['minima','🪫 Quase nenhuma'],['baixa','🌧️ Pouca'],['media','🌤️ Razoável'],['alta','☀️ Boa']].map(([k,v])=>`<button class="choice ${state.energy===k?'selected':''}" onclick="state.energy='${k}';save();render()">${v}</button>`).join('')}</div><div class="stat"><strong style="font-size:17px">${{minima:'2 minutos',baixa:'5 minutos',media:'15 minutos',alta:'25 minutos'}[state.energy]} de estudo sugerido</strong><p>${{minima:'Leia um único conceito ou descanse.',baixa:'Uma explicação e uma questão.',media:'Um conceito e três questões.',alta:'Questões, correção e revisão.'}[state.energy]}</p></div><button onclick="setPage('estudar')">Começar agora →</button></div><div class="card"><h2>Hoje, sem cobrança</h2><p>Você pode começar pequeno e ampliar a sessão se conseguir. Seu progresso não será zerado por faltar um dia.</p><div class="row"><div><strong>${state.answers.length}</strong><br><small>Respostas registradas</small></div><div><strong>${state.answers.filter(x=>x.ok).length}</strong><br><small>Acertos</small></div><div><strong>${state.studyDays.length}</strong><br><small>Dias de atividade</small></div></div></div>`}if(page==='estudar'){let t=topics[state.lastTopic%topics.length];h=`<div class="card"><span class="pill">Sessão adaptativa</span><h2>${t[1]}</h2><p class="muted">${t[0]}</p><p><strong>1.</strong> Abra uma aula curta ou PDF sobre esse assunto no Gran.</p><p><strong>2.</strong> Feche o material e tente explicar uma ideia em voz alta.</p><p><strong>3.</strong> Responda uma questão comentada.</p><a class="btn" href="${esc(state.granLink)}" target="_blank" rel="noopener noreferrer">Abrir Gran ↗</a> <button class="alt" onclick="state.lastTopic=(state.lastTopic+1)%topics.length;save();render()">Próximo assunto</button><hr style="border:0;border-top:1px solid #eee;margin:18px 0"><button onclick="qi=questions.findIndex(q=>q.t===state.lastTopic);if(qi<0)qi=0;setPage('questoes')">Fazer questão agora →</button></div><div class="card"><h2>Não consigo começar</h2><p>Experimente apenas abrir uma questão. Se não conseguir, encerrar sem punição também é permitido.</p><button class="alt" onclick="qi=0;setPage('questoes')">Só uma questão</button></div>`}if(page==='questoes'){let q=questions[qi];h=`<div class="card"><div class="row"><span class="pill">Questão autoral ${qi+1}/${questions.length}</span><small>${topics[q.t][0]}</small></div><h2 style="margin-top:14px">${q.q}</h2>${q.o.map((x,i)=>`<button class="choice ${selected===i?'selected':''} ${shown&&i===q.a?'correct':''} ${shown&&selected===i&&i!==q.a?'wrong':''}" onclick="selected=${i};render()" ${shown?'disabled':''}>${'ABCDE'[i]}) ${x}</button>`).join('')}${shown?`<div class="stat"><strong>${selected===q.a?'Você acertou!':'Resposta correta: '+ 'ABCDE'[q.a]}</strong><p>${q.e}</p></div><button onclick="qi=(qi+1)%questions.length;selected=-1;shown=false;render()">Próxima questão →</button>`:`<button ${selected<0?'disabled':''} onclick="answer()">Corrigir resposta</button>`}<p><small>Questões de treino criadas para o app, não extraídas de provas oficiais da FCC.</small></p></div>`}if(page==='revisar'){let pending=state.reviews.filter(x=>x.due<=new Date().toISOString().slice(0,10));h=header('Suas revisões','A revisão é guiada pelos erros. Sem punição por atrasos.')+`<div class="card"><h2>${pending.length} revisões disponíveis</h2>${pending.length?pending.map(x=>`<div class="stat" style="margin-bottom:8px"><strong>${topics[questions[x.q].t][1]}</strong><p>${questions[x.q].q}</p><button onclick="qi=${x.q};setPage('questoes')">Revisar agora</button></div>`).join(''):'<p>Quando você errar uma questão, ela aparecerá aqui para revisão.</p>'}</div>`}if(page==='edital'){h=header('Mapa de disciplinas','Mapa inicial de estudos. Confira cada subitem com o edital oficial e eventuais retificações.')+`<div class="card">${topics.map((x,i)=>`<div class="stat" style="margin:8px 0"><strong>${x[0]}</strong><p>${x[1]}</p><button class="alt" onclick="state.lastTopic=${i};save();setPage('estudar')">Estudar</button></div>`).join('')}<p class="note">Este protótipo ainda não contém a verticalização integral do edital nem todas as leis municipais. Não marque a cobertura como completa com base nesta tela.</p></div>`}if(page==='progresso'){let total=state.answers.length,correct=state.answers.filter(x=>x.ok).length;h=`<div class="card"><h2>Seu progresso real</h2><div class="grid"><div class="stat"><strong>${total}</strong><br><small>Respostas</small></div><div class="stat"><strong>${total?Math.round(correct/total*100):0}%</strong><br><small>Acertos</small></div></div><p>Taxa de acertos neste protótipo</p><div class="bar"><div style="width:${total?correct/total*100:0}%"></div></div><p class="muted">Uma amostra pequena não prevê a nota do concurso.</p><h2>Configurações</h2><label>Link do seu curso no Gran<br><input style="width:100%" id="gran" value="${esc(state.granLink)}" placeholder="https://..."></label><p><button onclick="let v=$('gran').value.trim();if(!/^https:\/\//i.test(v)){alert('Use um link https:// válido');return}state.granLink=v;save();alert('Link salvo neste dispositivo')">Salvar link</button></p><button class="alt" onclick="downloadBackup()">Exportar meu progresso</button></div>`} $('screen').innerHTML=h}function answer(){if(selected<0||shown)return;let q=questions[qi],ok=selected===q.a;state.answers.push({q:qi,choice:selected,ok,date:new Date().toISOString()});state.reviews=state.reviews.filter(x=>x.q!==qi);if(!ok){let dt=new Date();dt.setDate(dt.getDate()+1);state.reviews.push({q:qi,due:dt.toISOString().slice(0,10)})}markStudy();save();shown=true;render()}function downloadBackup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='manausprev-progresso.json';a.click();URL.revokeObjectURL(a.href)}render();</script></body></html>
