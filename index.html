<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14142a"><title>Manausprev • Meu caminho até a prova</title><style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');:root{--bg:#10101b;--card:#1b1b2c;--card2:#26253c;--border:#39364e;--txt:#f8f6ff;--muted:#bcb8d0;--purple:#a998ff;--green:#9be3bd;--yellow:#f4d38d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px Poppins,system-ui,sans-serif}header{background:linear-gradient(120deg,#1c1056,#31216b 60%,#1b1642);padding:28px max(20px,calc((100vw - 1060px)/2)) 25px}header small{color:#d1c9ff}h1{font-size:clamp(23px,4vw,34px);margin:8px 0}header p{color:#e0dafa;margin:0}main{max-width:1060px;margin:auto;padding:18px 16px 70px}.nav{display:flex;gap:8px;overflow-x:auto;padding:3px 0 14px;scrollbar-width:thin}.nav button{white-space:nowrap}.btn,button,select,input{font:inherit}button{border:1px solid var(--border);border-radius:12px;background:var(--card2);color:var(--txt);padding:11px 14px;cursor:pointer}button.primary{background:#5942ba;border-color:#5942ba;font-weight:700}button.active{background:#4c368f;border-color:#725bd1}.card{background:var(--card);border:1px solid var(--border);border-radius:19px;padding:20px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:13px}.grid .card{margin:0}h2{font-size:19px;margin:0 0 13px}h3{font-size:16px;margin:14px 0 8px}p{line-height:1.65}small,.muted{color:var(--muted)}.big{font-size:37px;font-weight:800;line-height:1.1}.metric{font-size:27px;font-weight:800}.chip{display:inline-block;background:#322b58;color:#dcd4ff;border-radius:30px;padding:5px 10px;font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.bar{height:9px;border-radius:20px;background:#343146;overflow:hidden;margin:9px 0}.bar>div{height:100%;background:linear-gradient(90deg,#8d79ef,#b8a6ff)}.task{padding:14px 0;border-bottom:1px solid var(--border)}.task:last-child{border-bottom:0}.task label{display:flex;align-items:flex-start;gap:10px;cursor:pointer}.task input[type=checkbox]{width:20px;height:20px;accent-color:#9b8bf0;flex-shrink:0;margin-top:2px}.task strong{display:block}.task span{display:block;color:var(--muted);font-size:13px;margin-top:3px}.options{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.options button{font-size:13px;padding:9px 12px}select,input[type=number],input[type=text]{background:#27253a;border:1px solid #55506d;color:white;border-radius:10px;padding:10px;max-width:100%}.note{border-left:3px solid var(--purple);padding:10px 14px;background:#242139;border-radius:0 10px 10px 0}.day{border:1px solid var(--border);border-radius:13px;padding:14px;margin:9px 0}.day.today{border-color:#9988e8}.day .row{align-items:start}.topic{border:1px solid var(--border);border-radius:12px;margin:9px 0;padding:12px}.topic select{width:100%;margin-top:9px}.danger{color:#ffc3c8}.good{color:var(--green)}.hidden{display:none}footer{color:var(--muted);text-align:center;font-size:12px;padding:15px}.quote{font-size:18px;font-weight:600;line-height:1.5}a{color:#d2c8ff}details{margin:9px 0;border:1px solid var(--border);border-radius:12px;padding:13px}summary{cursor:pointer;font-weight:600}input[type=range]{accent-color:#a998ff;width:100%}@media(max-width:560px){.card{padding:16px}.big{font-size:31px}header{padding:24px 18px}}

.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.calendar-week{text-align:center;color:var(--muted);font-size:12px;padding:9px 0}.calendar-cell{min-height:80px;padding:8px 5px;border:1px solid var(--border);border-radius:11px;background:#242337;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:5px;overflow:hidden}.calendar-cell.empty{background:transparent;border-color:transparent}.calendar-cell.today{outline:2px solid var(--purple)}.calendar-cell.selected{background:#3b326a;border-color:#aa96ff}.calendar-cell .dot{font-size:10px;color:#aee8c6;line-height:1.25;overflow-wrap:anywhere}.calendar-cell .num{font-weight:700}.calendar-cell .tiny{font-size:10px;color:#d2c8ff}.field{width:100%;padding:12px;background:#27253a;border:1px solid #55506d;border-radius:10px;color:white;font:inherit}.timer-display{font-size:clamp(52px,11vw,94px);font-weight:800;text-align:center;letter-spacing:2px;font-variant-numeric:tabular-nums;margin:16px 0}.timer-progress{height:12px;background:#353149;border-radius:20px;overflow:hidden}.timer-progress div{height:100%;background:#a998ff;transition:width .25s}.timer-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:16px 0}.helper{color:var(--muted);font-size:13px}@media(max-width:560px){.calendar-grid{gap:3px}.calendar-cell{min-height:69px;padding:6px 3px}.calendar-cell .dot{font-size:9px}.calendar-cell .tiny{font-size:9px}}
</style></head><body><header><small>CONCURSO MANAUSPREV • FCC</small><h1>Meu caminho até a aprovação ✦</h1><p>Um plano claro para hoje. Uma preparação construída dia após dia.</p></header><main><nav class="nav" id="nav"></nav><section id="content"></section><footer>Planejador independente • Dados salvos apenas neste navegador. Conteúdo do edital deve ser conferido com o documento oficial.</footer></main><script>
const EXAM='2026-12-06T09:00:00';const subjects=[['Língua Portuguesa',1,['Interpretação de textos','Ortografia e acentuação','Classes de palavras','Concordância e regência','Crase e pontuação','Coesão e coerência']],['Raciocínio Lógico-Matemático',1,['Proposições e conectivos','Equivalências e negações','Conjuntos e diagramas','Porcentagens e proporções','Problemas lógico-matemáticos']],['Informática',1,['Sistemas operacionais','Editor de textos e planilhas','Internet e navegadores','Segurança da informação']],['Direito Constitucional',3,['Princípios fundamentais','Direitos e garantias fundamentais','Organização do Estado','Administração pública: art. 37','Servidores públicos']],['Direito Administrativo',3,['Princípios administrativos','Atos administrativos','Poderes administrativos','Licitações e contratos','Responsabilidade civil do Estado','Processo administrativo']],['Direito Previdenciário',3,['Seguridade social','Regimes de previdência','RPPS: fundamentos','Benefícios e custeio','Regras constitucionais previdenciárias']],['Direito Civil',3,['Pessoas naturais e jurídicas','Bens e fatos jurídicos','Prescrição e decadência']],['Legislação municipal e previdenciária',3,['Normas locais do RPPS de Manaus','Estrutura e competências da Manausprev','Regras municipais aplicáveis']]];
const key='manausprev_planner_v3';let state={energy:'media',minutes:60,checks:{},status:{},history:{},notes:'',completedDays:{},streakLast:'',customDate:'',view:'inicio',calendarEntries:{},focusSessions:[],timerPreset:25};try{state={...state,...JSON.parse(localStorage.getItem(key)||'{}')}}catch(e){};const save=()=>localStorage.setItem(key,JSON.stringify(state));const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toLocaleDateString('en-CA');const datefmt=d=>new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'});const daysLeft=()=>Math.max(0,Math.ceil((new Date(EXAM)-new Date())/86400000));const all=subjects.flatMap((s,i)=>s[2].map((t,j)=>({id:i+'-'+j,name:t,subject:s[0],weight:s[1]})));const counts=()=>({done:all.filter(t=>state.status[t.id]==='feito'||state.status[t.id]==='revisado').length,review:all.filter(t=>state.status[t.id]==='revisado').length,total:all.length});const tabs=[['inicio','Início'],['reta','Reta final'],['cronograma','Cronograma'],['calendario','Calendário'],['cronometro','Cronômetro'],['edital','Edital'],['tecnicas','Técnicas'],['motivacao','Motivação'],['progresso','Progresso']];const quot=['Você não precisa vencer o edital inteiro hoje. Precisa saber qual é o próximo passo.','Constância não é estudar perfeitamente. É conseguir retomar.','Um assunto entendido vale mais que horas sem direção.','O plano deve se adaptar à sua vida, não o contrário.','Você pode começar com pouco e aumentar quando conseguir.'];function nav(){ $('#nav').innerHTML=tabs.map(([id,n])=>`<button class="${state.view===id?'active':''}" onclick="go('${id}')">${n}</button>`).join('') }function go(v){state.view=v;save();render();window.scrollTo({top:0,behavior:'smooth'})}function setEnergy(v){state.energy=v;save();render()}function setMinutes(v){state.minutes=+v;save();render()}function topicOrder(){return [...all].sort((a,b)=>{let x=state.status[a.id]||'pendente',y=state.status[b.id]||'pendente';let rank={pendente:0,estudando:1,feito:3,revisado:4};return (rank[x]-rank[y])||(b.weight-a.weight)||(a.id.localeCompare(b.id))})}function recommended(){return topicOrder().filter(t=>!['feito','revisado'].includes(state.status[t.id])).slice(0,3)}function updateStatus(id,v){state.status[id]=v;save();render()}function mark(id){state.checks[id]=!state.checks[id];save();render()}function task(id,title,desc){return `<div class="task"><label><input type="checkbox" ${state.checks[id]?'checked':''} onchange="mark('${id}')"><div><strong>${title}</strong><span>${desc}</span></div></label></div>`}function dashboard(){let c=counts(),rec=recommended(),d=daysLeft(),pct=Math.round(c.done/c.total*100),mins=state.energy==='baixa'?Math.min(15,state.minutes):state.energy==='media'?Math.min(45,state.minutes):state.minutes;return `<div class="grid"><div class="card"><small>CONTAGEM REGRESSIVA</small><div class="big">${d} dias</div><p class="muted">Prova prevista para 6 de dezembro de 2026</p></div><div class="card"><small>EDITAL EM ANDAMENTO</small><div class="metric">${pct}%</div><div class="bar"><div style="width:${pct}%"></div></div><small>${c.done} de ${c.total} tópicos estudados ou revisados</small></div><div class="card"><small>SEU FOCO HOJE</small><div class="metric">${mins} min</div><p class="muted">Tempo adaptado à sua energia e disponibilidade</p></div></div><div class="card" style="margin-top:14px"><h2>Como você está hoje?</h2><p class="muted">Ajuste o plano sem perder a direção.</p><div class="options">${[['baixa','🪫 Energia baixa'],['media','🌤️ Energia média'],['alta','☀️ Energia boa']].map(([v,n])=>`<button class="${state.energy===v?'active':''}" onclick="setEnergy('${v}')">${n}</button>`).join('')}</div><label for="mins">Quanto tempo você tem disponível?</label><div class="options">${[15,30,60,90,120].map(n=>`<button class="${state.minutes===n?'active':''}" onclick="setMinutes(${n})">${n} min</button>`).join('')}</div><div class="card"><div class="row"><h2>Seu plano de hoje</h2><span class="chip">${mins} minutos</span></div><p class="quote">${quot[new Date().getDate()%quot.length]}</p>${rec.length?`${task('today-study-'+today(),'1. Estudar: '+esc(rec[0].name),esc(rec[0].subject)+' • Gran Cursos • '+Math.max(5,Math.round(mins*.55))+' min')}${task('today-recall-'+today(),'2. Recuperação ativa','Feche o material e explique o assunto sem olhar • '+Math.max(3,Math.round(mins*.2))+' min')}${task('today-questions-'+today(),'3. Questões FCC comentadas','Resolva e analise os erros • '+Math.max(5,Math.round(mins*.25))+' min')}`:'<p>Todos os tópicos do roteiro foram marcados! Confira suas revisões.</p>'}<p class="muted">Você pode concluir uma etapa de cada vez. Os itens marcados permanecem salvos.</p><div class="options"><button class="primary" onclick="go('cronograma')">Ver cronograma →</button><button onclick="go('cronometro')">Iniciar foco ⏱</button><button onclick="go('calendario')">Meu calendário 📅</button></div></div><div class="card"><h2>Prioridades sugeridas</h2>${rec.map(t=>`<div class="task"><strong>${esc(t.subject)}</strong><span>${esc(t.name)}</span></div>`).join('')}<p class="muted">Sugestões automáticas; a ordem definitiva deve seguir o edital e seu desempenho.</p></div>`}function schedule(){let start=new Date();start.setHours(12,0,0,0);let ordered=topicOrder(),base=state.minutes,days=daysLeft();return `<div class="card"><h2>Seu cronograma de 7 dias</h2><p>Distribuição sugerida de acordo com o tempo disponível e com os tópicos ainda pendentes. Prioriza disciplinas de maior peso.</p><div class="note"><strong>Regra do plano:</strong> estudo + recuperação ativa + questões + revisão. Ajuste o tempo em Início; marque o edital para atualizar as prioridades.</div></div>${Array.from({length:Math.min(7,days||7)},(_,i)=>{let dt=new Date(start);dt.setDate(dt.getDate()+i);let ds=dt.toLocaleDateString('en-CA'),t=ordered[i%Math.max(1,ordered.length)]||all[i%all.length],t2=ordered[(i+2)%Math.max(1,ordered.length)]||all[(i+2)%all.length];return `<div class="day ${i===0?'today':''}"><div class="row"><strong>${i===0?'Hoje • ':''}${datefmt(ds)}</strong><span class="chip">${i===6?'Revisão semanal':base+' min'}</span></div>${task('schedule-'+ds+'-1',i===6?'Revisar erros da semana':esc(t.subject)+' — '+esc(t.name),i===6?'Revise anotações e questões erradas':'Gran • '+Math.round(base*.55)+' min')}${task('schedule-'+ds+'-2',i===6?'Mini simulado FCC':esc(t2.subject)+' — '+esc(t2.name),i===6?'Cronometre e corrija os erros':'Questões e revisão • '+Math.round(base*.45)+' min')}</div>`}).join('')}<div class="card"><h2>Como usar este cronograma</h2><p>O plano é uma proposta inicial e não substitui a conferência do edital. Se perder um dia, não precisa compensar tudo: retome o próximo bloco prioritário.</p></div>`}function syllabus(){let c=counts();return `<div class="card"><h2>Edital em checklist</h2><p><strong>${c.done}/${c.total} tópicos</strong> com estudo concluído ou revisão registrada.</p><div class="bar"><div style="width:${Math.round(c.done/c.total*100)}%"></div></div><div class="note"><strong>Importante:</strong> esta lista é um roteiro preliminar de organização, <strong>não uma transcrição integral ou conferida do edital oficial</strong>. Especialmente a legislação municipal precisa ser confrontada com o edital antes de considerá-la completa.</div></div>${subjects.map((s,i)=>{let list=all.filter(t=>t.id.startsWith(i+'-'));let done=list.filter(t=>['feito','revisado'].includes(state.status[t.id])).length;return `<details ${i===0?'open':''}><summary>${esc(s[0])} • ${done}/${list.length} <span class="chip">Peso de referência ${s[1]}</span></summary>${list.map(t=>`<div class="topic"><strong>${esc(t.name)}</strong><select aria-label="Situação de ${esc(t.name)}" onchange="updateStatus('${t.id}',this.value)">${[['pendente','Não comecei'],['estudando','Estudando'],['feito','Estudado'],['revisado','Revisado']].map(([v,n])=>`<option value="${v}" ${(state.status[t.id]||'pendente')===v?'selected':''}>${n}</option>`).join('')}</select></div>`).join('')}</details>`}).join('')}`}
function techniques(){let data=[['Recuperação ativa','Depois de estudar, feche o material e tente explicar o conteúdo com suas próprias palavras. Só então confira o que esqueceu.','Após cada bloco de estudo'],['Revisão espaçada','Reveja o conteúdo em intervalos crescentes. Exemplo inicial: 1, 3, 7 e 14 dias, ajustando conforme seus erros.','Revisões de 5 a 15 minutos'],['Questões com correção','Resolva questões da banca FCC. Analise por que a alternativa correta é correta e por que as demais estão erradas.','Depois da teoria e nos simulados'],['Intercalação de matérias','Alterne disciplinas e tipos de problema ao longo da semana. Evite passar dias inteiros em um único assunto.','No cronograma semanal'],['Blocos de foco','Use blocos de 25 minutos com pausa curta, ou blocos de 5 a 10 minutos em dias de pouca energia.','Quando estiver difícil começar'],['Caderno de erros','Registre o assunto, o motivo do erro e a regra que precisa lembrar. Refaça a questão depois, sem consultar.','Ao corrigir questões'],['Simulados cronometrados','Treine resistência, administração do tempo e revisão de respostas. Registre erros por matéria.','Progressivamente até a prova']];return `<div class="card"><h2>Técnicas que realmente ajudam</h2><p>O aplicativo organiza o método. O estudo do conteúdo e as questões podem ser feitos no Gran.</p></div>${data.map(([t,d,w],i)=>`<details ${i===0?'open':''}><summary>${t}</summary><p>${d}</p><span class="chip">${w}</span></details>`).join('')}<div class="card"><h2>Rotina simples para um bloco de 60 minutos</h2>${task('tech-1-'+today(),'30 min — aprender','Aula ou PDF no Gran, com uma pergunta-guia')}${task('tech-2-'+today(),'10 min — lembrar','Explique sem olhar e identifique lacunas')}${task('tech-3-'+today(),'15 min — praticar','Questões comentadas da FCC')}${task('tech-4-'+today(),'5 min — registrar','Anote erros e programe revisão')}</div>`}function motivation(){let d=daysLeft();return `<div class="card"><h2>Motivação que vira ação</h2><p class="quote">${quot[new Date().getDate()%quot.length]}</p><p>Faltam <strong>${d} dias</strong> para a prova. Você não precisa sentir motivação para começar: pode usar uma ação pequena como ponto de partida.</p><div class="options"><button class="primary" onclick="setEnergy('baixa');go('inicio')">Hoje só consigo o mínimo</button><button onclick="go('cronograma')">Quero seguir o plano</button></div></div><div class="card"><h2>Por que vale a pena estudar?</h2><p>Porque estudar hoje aumenta suas possibilidades de chegar à prova preparada e disputar uma vaga que pode trazer mais estabilidade e autonomia. A aprovação não é garantida, mas cada conteúdo compreendido e cada erro corrigido melhora sua preparação.</p><p><strong>Quando faltar vontade:</strong> você não precisa esperar a motivação aparecer. Escolha uma tarefa pequena, comece por cinco minutos e decida depois se continua.</p><p><strong>Quando se comparar:</strong> seu progresso deve ser medido pelo que você consegue aprender e revisar, não pelo ritmo de outras pessoas.</p><p><strong>Quando estiver exausta:</strong> descanso também faz parte de uma preparação sustentável. Recomeçar no dia seguinte é melhor que abandonar o plano.</p></div><div class="card"><h2>Plano de emergência: 5 minutos</h2>${task('tiny-1-'+today(),'1 minuto — abrir o Gran','Escolha um único tópico do cronograma')}${task('tiny-2-'+today(),'3 minutos — ler ou assistir','Sem tentar terminar tudo')}${task('tiny-3-'+today(),'1 minuto — recordar','Diga uma coisa que aprendeu')}<p class="muted">Se conseguir continuar, ótimo. Se não, a pequena ação ainda conta.</p></div><div class="card"><h2>O que fazer quando a motivação não vem</h2><div class="grid"><div><h3>1. Reduza a entrada</h3><p>Em vez de “estudar Direito”, faça “abrir o PDF e ler uma página”.</p></div><div><h3>2. Tire a decisão da frente</h3><p>Use o cronograma: a matéria do dia já estará escolhida.</p></div><div><h3>3. Marque o que fez</h3><p>Registrar pequenos avanços torna o esforço visível.</p></div><div><h3>4. Recomece sem compensar</h3><p>Um dia ruim não exige estudar o dobro no seguinte.</p></div></div></div><div class="card"><h2>Meu motivo para continuar</h2><p class="muted">Escreva algo pessoal que queira lembrar nos dias difíceis. Fica salvo apenas neste navegador.</p><textarea id="why" style="width:100%;min-height:110px;background:#26253c;color:white;border:1px solid #55506d;border-radius:12px;padding:12px;font:inherit" placeholder="Por que essa aprovação importa para mim?">${esc(state.notes)}</textarea><p><button onclick="state.notes=$('#why').value;save();this.textContent='Salvo ✓'">Salvar meu motivo</button></p></div>`}function progress(){let c=counts(),done=Object.values(state.checks).filter(Boolean).length;return `<div class="grid"><div class="card"><small>TÓPICOS ESTUDADOS</small><div class="metric">${c.done} / ${c.total}</div></div><div class="card"><small>TÓPICOS REVISADOS</small><div class="metric">${c.review}</div></div><div class="card"><small>ETAPAS CONCLUÍDAS</small><div class="metric">${done}</div></div></div><div class="card" style="margin-top:14px"><h2>Tempo de foco registrado</h2><div class="metric">${(state.focusSessions||[]).reduce((a,x)=>a+x.minutes,0)} minutos</div><p class="muted">Total de sessões registradas no cronômetro.</p></div><div class="card" style="margin-top:14px"><h2>Avanço por disciplina</h2>${subjects.map((s,i)=>{let ts=all.filter(t=>t.id.startsWith(i+'-')),n=ts.filter(t=>['feito','revisado'].includes(state.status[t.id])).length;return `<div style="margin:16px 0"><div class="row"><strong>${esc(s[0])}</strong><small>${n}/${ts.length}</small></div><div class="bar"><div style="width:${Math.round(n/ts.length*100)}%"></div></div></div>`}).join('')}</div><div class="card"><h2>Seus dados</h2><p class="muted">O progresso é salvo neste dispositivo/navegador. Se limpar os dados do navegador, ele pode desaparecer.</p><button onclick="exportData()">Exportar backup</button> <button onclick="document.getElementById('importFile').click()">Importar backup</button><input id="importFile" class="hidden" type="file" accept="application/json" onchange="importData(this)"><p><button onclick="if(confirm('Apagar todo o progresso salvo neste navegador?')){localStorage.removeItem(key);location.reload()}" style="color:#ffc3c8">Apagar progresso</button></p></div>`}function exportData(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='manausprev-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||typeof x!=='object'||!x.checks||!x.status)throw Error();state={...state,...x};save();render();alert('Backup importado')}catch(e){alert('Arquivo de backup inválido')}};r.readAsText(f)}
// Calendário e cronômetro: armazenamento local e controle de tempo por relógio real.
let calendarOffset=0,selectedCalendarDay=today();
function isoLocal(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function calendarPage(){let base=new Date();base.setDate(1);base.setMonth(base.getMonth()+calendarOffset);let year=base.getFullYear(),month=base.getMonth(),first=(base.getDay()+6)%7,last=new Date(year,month+1,0).getDate();let title=base.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});let cells=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x=>`<div class="calendar-week">${x}</div>`).join('');for(let i=0;i<first;i++)cells+='<div class="calendar-cell empty"></div>';for(let d=1;d<=last;d++){let id=isoLocal(new Date(year,month,d)),item=state.calendarEntries[id]||{},n=Object.keys(state.checks).filter(k=>k.startsWith('schedule-'+id)&&state.checks[k]).length;cells+=`<button class="calendar-cell ${id===today()?'today':''} ${id===selectedCalendarDay?'selected':''}" onclick="selectCalendar('${id}')"><span class="num">${d}</span>${item.subject?`<span class="dot">${esc(item.subject).slice(0,36)}</span>`:''}${item.done?'<span class="tiny">✓ Feito</span>':n?`<span class="tiny">✓ ${n} tarefa(s)</span>`:''}</button>`}let item=state.calendarEntries[selectedCalendarDay]||{},days=daysLeft();return `<div class="card"><div class="calendar-head"><div><h2>Calendário de estudos</h2><p class="muted">Planeje datas, marque dias concluídos e acompanhe sua rotina.</p></div><span class="chip">${days} dias até a prova</span></div><div class="calendar-head"><button onclick="changeMonth(-1)" aria-label="Mês anterior">←</button><h3 style="text-transform:capitalize">${title}</h3><button onclick="changeMonth(1)" aria-label="Próximo mês">→</button></div><div class="calendar-grid">${cells}</div><p class="helper">Toque em um dia para definir a matéria, a meta e a situação.</p></div><div class="card"><h2>Planejar ${datefmt(selectedCalendarDay)}</h2><label for="calSubject">Matéria ou assunto</label><input class="field" id="calSubject" type="text" maxlength="160" placeholder="Ex.: Português — interpretação" value="${esc(item.subject||'')}"><p><label for="calGoal">Minha meta</label><textarea class="field" id="calGoal" rows="3" maxlength="600" placeholder="Ex.: 25 minutos de teoria, 10 questões e revisão dos erros">${esc(item.goal||'')}</textarea></p><label for="calMinutes">Tempo planejado (minutos)</label><input class="field" id="calMinutes" type="number" min="0" max="600" value="${Number(item.minutes)||30}"><p><label><input id="calDone" type="checkbox" ${item.done?'checked':''}> Concluí o que era possível neste dia</label></p><div class="options"><button class="primary" onclick="saveCalendar()">Salvar este dia</button><button onclick="clearCalendar()">Limpar este dia</button><button onclick="go('cronometro')">Abrir cronômetro →</button></div></div><div class="card"><h2>Como usar o calendário</h2><p>Distribua assuntos de maior peso ao longo da semana e reserve dias para revisar e fazer questões. Não tente preencher todas as horas: planeje o que é possível e ajuste quando necessário.</p><p class="helper">Os dados ficam salvos no navegador. Faça backups na aba Progresso.</p></div>`}
function changeMonth(n){calendarOffset+=n;let d=new Date();d.setDate(1);d.setMonth(d.getMonth()+calendarOffset);selectedCalendarDay=isoLocal(d);render()}
function selectCalendar(id){selectedCalendarDay=id;render()}
function saveCalendar(){let m=Math.max(0,Math.min(600,Number($('#calMinutes').value)||0));state.calendarEntries[selectedCalendarDay]={subject:$('#calSubject').value.trim(),goal:$('#calGoal').value.trim(),minutes:m,done:$('#calDone').checked};save();render()}
function clearCalendar(){delete state.calendarEntries[selectedCalendarDay];save();render()}
let timerDuration=25*60,timerRemaining=25*60,timerRunning=false,timerEndsAt=0,timerInterval=null;
function setTimerPreset(m){timerRunning=false;clearInterval(timerInterval);timerDuration=m*60;timerRemaining=timerDuration;state.timerPreset=m;save();render()}
function timerPage(){if(!timerRunning&&timerRemaining===25*60&&state.timerPreset!==25){timerDuration=state.timerPreset*60;timerRemaining=timerDuration}let sessions=(state.focusSessions||[]).filter(x=>x.date===today()),sum=sessions.reduce((a,x)=>a+x.minutes,0);return `<div class="card"><h2>Cronômetro de foco</h2><p class="muted">Escolha um bloco realista. Você pode pausar, continuar ou encerrar sem perder seu esforço.</p><div class="options">${[5,10,15,25,40,50].map(n=>`<button class="${state.timerPreset===n?'active':''}" onclick="setTimerPreset(${n})">${n} min</button>`).join('')}</div><div class="timer-display" id="timerDisplay" aria-live="off">${formatTimer(timerRemaining)}</div><div class="timer-progress"><div id="timerBar" style="width:${100*(1-timerRemaining/timerDuration)}%"></div></div><div class="timer-actions"><button class="primary" id="timerStart" onclick="toggleTimer()">${timerRunning?'Pausar':'Começar / continuar'}</button><button onclick="resetTimer()">Reiniciar</button><button onclick="finishTimer()">Registrar sessão</button></div><p class="helper" id="timerStatus">${timerRunning?'Seu bloco está em andamento.':'Pronto para começar. Uma tarefa de cada vez.'}</p></div><div class="grid"><div class="card"><small>FOCO REGISTRADO HOJE</small><div class="metric">${sum} min</div><p class="muted">${sessions.length} sessão(ões) registrada(s)</p></div><div class="card"><h2>Como usar</h2><p>Defina um único objetivo antes de iniciar. Ao terminar, feche o material e tente lembrar o que estudou. Faça uma pausa curta antes do próximo bloco.</p></div></div><div class="card" style="margin-top:14px"><h2>Motivação durante o foco</h2><p>Não precisa fazer o bloco perfeito. Se cinco minutos forem possíveis hoje, eles podem ser seu ponto de partida. O importante é que o cronômetro ajude, não pressione.</p></div>`}
function formatTimer(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function refreshTimer(){if(timerRunning){timerRemaining=Math.max(0,Math.ceil((timerEndsAt-Date.now())/1000));if(timerRemaining<=0){timerRunning=false;clearInterval(timerInterval);if(state.view==='cronometro'){$('#timerStatus').textContent='Bloco concluído! Registre sua sessão para salvar o tempo.'}}}if(state.view==='cronometro'){let el=$('#timerDisplay');if(el)el.textContent=formatTimer(timerRemaining);let bar=$('#timerBar');if(bar)bar.style.width=(100*(1-timerRemaining/timerDuration))+'%';let btn=$('#timerStart');if(btn)btn.textContent=timerRunning?'Pausar':'Começar / continuar'}}
function toggleTimer(){if(timerRunning){timerRemaining=Math.max(0,Math.ceil((timerEndsAt-Date.now())/1000));timerRunning=false;clearInterval(timerInterval)}else{if(timerRemaining<=0)timerRemaining=timerDuration;timerEndsAt=Date.now()+timerRemaining*1000;timerRunning=true;timerInterval=setInterval(refreshTimer,250)}refreshTimer()}
function resetTimer(){timerRunning=false;clearInterval(timerInterval);timerRemaining=timerDuration;render()}
function finishTimer(){if(timerRunning){timerRemaining=Math.max(0,Math.ceil((timerEndsAt-Date.now())/1000))}timerRunning=false;clearInterval(timerInterval);let elapsed=Math.max(0,Math.round((timerDuration-timerRemaining)/60));if(!elapsed){alert('Inicie o cronômetro e estude ao menos um minuto antes de registrar.');return}state.focusSessions=state.focusSessions||[];state.focusSessions.push({date:today(),minutes:elapsed});save();timerRemaining=timerDuration;render()}


function retaFinal(){
 const d=daysLeft(), c=counts(), pending=Math.max(0,c.total-c.done), perWeek=d>0?Math.ceil(pending/Math.max(1,d/7)):pending;
 const now=new Date(), target=new Date(EXAM), diff=Math.max(0,target-now), hrs=Math.floor(diff/3600000)%24, mins=Math.floor(diff/60000)%60;
 const doneToday=['today-study-','today-recall-','today-questions-'].filter(x=>state.checks[x+today()]).length;
 const remaining=3-doneToday;
 const intensity=d<=7?'SEMANA DA PROVA':d<=21?'RETA DECISIVA':'CONTAGEM REGRESSIVA';
 return `<div class="card" style="border:1px solid #8b73e8;background:linear-gradient(140deg,#23174b,#1c1a29)"><small>${intensity} • 6 DE DEZEMBRO DE 2026</small><div class="big" style="font-size:clamp(44px,8vw,78px);line-height:1.2">${d} <span style="font-size:20px">dias</span></div><h2>${hrs} horas e ${mins} minutos além dos dias completos</h2><p>O tempo é limitado. O que importa é transformar essa informação em ações específicas hoje.</p><div class="options"><button class="primary" onclick="go('cronometro')">Começar um bloco agora ⏱</button><button onclick="go('cronograma')">Ver tarefas de hoje</button></div></div>
 <div class="grid"><div class="card"><small>ROTEIRO PENDENTE</small><div class="metric">${pending}</div><p class="muted">de ${c.total} tópicos ainda não marcados como estudados</p></div><div class="card"><small>RITMO DE REFERÊNCIA</small><div class="metric">${perWeek}/semana</div><p class="muted">Tópicos por semana para concluir este roteiro antes da prova. Estimativa, não garantia de domínio.</p></div><div class="card"><small>TAREFAS DE HOJE</small><div class="metric">${doneToday}/3</div><p class="muted">${remaining===0?'Etapas de hoje registradas.':'Faltam '+remaining+' etapas para concluir o plano básico de hoje.'}</p></div></div>
 <div class="card"><h2>Missão de hoje</h2><p>Escolha o próximo passo. Marque cada etapa ao terminar; não é necessário estudar por horas sem pausa.</p>
 ${task('today-study-'+today(),'1. Avançar no assunto prioritário','Use o Gran e registre o assunto no edital')}
 ${task('today-recall-'+today(),'2. Recuperar sem olhar','Explique o que aprendeu com suas palavras')}
 ${task('today-questions-'+today(),'3. Resolver e corrigir questões','Priorize erros e comentários da banca FCC')}
 <div class="options"><button class="primary" onclick="go('edital')">Ver tópicos pendentes</button><button onclick="go('calendario')">Planejar no calendário</button></div></div>
 <div class="card"><h2>Alerta de ritmo</h2><p>${pending===0?'Todos os tópicos do roteiro estão marcados. Priorize revisões e simulados.':d===0?'A data prevista chegou. Consulte as orientações oficiais da prova.':perWeek>=10?'Há muitos tópicos pendentes para o tempo disponível. Priorize matérias de maior peso e questões; não tente estudar tudo com a mesma profundidade.':'Há tempo para avançar, desde que você mantenha um plano de estudo e revisão.'}</p><p class="muted">A lista do edital neste aplicativo é preliminar e pode não corresponder à totalidade do edital oficial. A contagem considera a data prevista da prova.</p></div>`;
}
function render(){nav();$('#content').innerHTML=({inicio:dashboard,reta:retaFinal,cronograma:schedule,calendario:calendarPage,cronometro:timerPage,edital:syllabus,tecnicas:techniques,motivacao:motivation,progresso:progress}[state.view]||dashboard)()}render();
</script></body></html>
