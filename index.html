<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14142a"><title>Manausprev • Meu caminho até a prova</title><style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');:root{--bg:#10101b;--card:#1b1b2c;--card2:#26253c;--border:#39364e;--txt:#f8f6ff;--muted:#bcb8d0;--purple:#a998ff;--green:#9be3bd;--yellow:#f4d38d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px Poppins,system-ui,sans-serif}header{background:linear-gradient(120deg,#1c1056,#31216b 60%,#1b1642);padding:28px max(20px,calc((100vw - 1060px)/2)) 25px}header small{color:#d1c9ff}h1{font-size:clamp(23px,4vw,34px);margin:8px 0}header p{color:#e0dafa;margin:0}main{max-width:1060px;margin:auto;padding:18px 16px 70px}.nav{display:flex;gap:8px;overflow-x:auto;padding:3px 0 14px;scrollbar-width:thin}.nav button{white-space:nowrap}.btn,button,select,input{font:inherit}button{border:1px solid var(--border);border-radius:12px;background:var(--card2);color:var(--txt);padding:11px 14px;cursor:pointer}button.primary{background:#5942ba;border-color:#5942ba;font-weight:700}button.active{background:#4c368f;border-color:#725bd1}.card{background:var(--card);border:1px solid var(--border);border-radius:19px;padding:20px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:13px}.grid .card{margin:0}h2{font-size:19px;margin:0 0 13px}h3{font-size:16px;margin:14px 0 8px}p{line-height:1.65}small,.muted{color:var(--muted)}.big{font-size:37px;font-weight:800;line-height:1.1}.metric{font-size:27px;font-weight:800}.chip{display:inline-block;background:#322b58;color:#dcd4ff;border-radius:30px;padding:5px 10px;font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.bar{height:9px;border-radius:20px;background:#343146;overflow:hidden;margin:9px 0}.bar>div{height:100%;background:linear-gradient(90deg,#8d79ef,#b8a6ff)}.task{padding:14px 0;border-bottom:1px solid var(--border)}.task:last-child{border-bottom:0}.task label{display:flex;align-items:flex-start;gap:10px;cursor:pointer}.task input[type=checkbox]{width:20px;height:20px;accent-color:#9b8bf0;flex-shrink:0;margin-top:2px}.task strong{display:block}.task span{display:block;color:var(--muted);font-size:13px;margin-top:3px}.options{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.options button{font-size:13px;padding:9px 12px}select,input[type=number],input[type=text]{background:#27253a;border:1px solid #55506d;color:white;border-radius:10px;padding:10px;max-width:100%}.note{border-left:3px solid var(--purple);padding:10px 14px;background:#242139;border-radius:0 10px 10px 0}.day{border:1px solid var(--border);border-radius:13px;padding:14px;margin:9px 0}.day.today{border-color:#9988e8}.day .row{align-items:start}.topic{border:1px solid var(--border);border-radius:12px;margin:9px 0;padding:12px}.topic select{width:100%;margin-top:9px}.danger{color:#ffc3c8}.good{color:var(--green)}.hidden{display:none}footer{color:var(--muted);text-align:center;font-size:12px;padding:15px}.quote{font-size:18px;font-weight:600;line-height:1.5}a{color:#d2c8ff}details{margin:9px 0;border:1px solid var(--border);border-radius:12px;padding:13px}summary{cursor:pointer;font-weight:600}input[type=range]{accent-color:#a998ff;width:100%}@media(max-width:560px){.card{padding:16px}.big{font-size:31px}header{padding:24px 18px}}
</style></head><body><header><small>CONCURSO MANAUSPREV • FCC</small><h1>Meu caminho até a aprovação ✦</h1><p>Um plano claro para hoje. Uma preparação construída dia após dia.</p></header><main><nav class="nav" id="nav"></nav><section id="content"></section><footer>Planejador independente • Dados salvos apenas neste navegador. Conteúdo do edital deve ser conferido com o documento oficial.</footer></main><script>
const EXAM='2026-12-06T09:00:00';const subjects=[['Língua Portuguesa',1,['Interpretação de textos','Ortografia e acentuação','Classes de palavras','Concordância e regência','Crase e pontuação','Coesão e coerência']],['Raciocínio Lógico-Matemático',1,['Proposições e conectivos','Equivalências e negações','Conjuntos e diagramas','Porcentagens e proporções','Problemas lógico-matemáticos']],['Informática',1,['Sistemas operacionais','Editor de textos e planilhas','Internet e navegadores','Segurança da informação']],['Direito Constitucional',3,['Princípios fundamentais','Direitos e garantias fundamentais','Organização do Estado','Administração pública: art. 37','Servidores públicos']],['Direito Administrativo',3,['Princípios administrativos','Atos administrativos','Poderes administrativos','Licitações e contratos','Responsabilidade civil do Estado','Processo administrativo']],['Direito Previdenciário',3,['Seguridade social','Regimes de previdência','RPPS: fundamentos','Benefícios e custeio','Regras constitucionais previdenciárias']],['Direito Civil',3,['Pessoas naturais e jurídicas','Bens e fatos jurídicos','Prescrição e decadência']],['Legislação municipal e previdenciária',3,['Normas locais do RPPS de Manaus','Estrutura e competências da Manausprev','Regras municipais aplicáveis']]];
const key='manausprev_planner_v3';let state={energy:'media',minutes:60,checks:{},status:{},history:{},notes:'',completedDays:{},streakLast:'',customDate:'',view:'inicio'};try{state={...state,...JSON.parse(localStorage.getItem(key)||'{}')}}catch(e){};const save=()=>localStorage.setItem(key,JSON.stringify(state));const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toLocaleDateString('en-CA');const datefmt=d=>new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'});const daysLeft=()=>Math.max(0,Math.ceil((new Date(EXAM)-new Date())/86400000));const all=subjects.flatMap((s,i)=>s[2].map((t,j)=>({id:i+'-'+j,name:t,subject:s[0],weight:s[1]})));const counts=()=>({done:all.filter(t=>state.status[t.id]==='feito'||state.status[t.id]==='revisado').length,review:all.filter(t=>state.status[t.id]==='revisado').length,total:all.length});const tabs=[['inicio','Início'],['cronograma','Cronograma'],['edital','Edital'],['tecnicas','Técnicas'],['motivacao','Motivação'],['progresso','Progresso']];const quot=['Você não precisa vencer o edital inteiro hoje. Precisa saber qual é o próximo passo.','Constância não é estudar perfeitamente. É conseguir retomar.','Um assunto entendido vale mais que horas sem direção.','O plano deve se adaptar à sua vida, não o contrário.','Você pode começar com pouco e aumentar quando conseguir.'];function nav(){ $('#nav').innerHTML=tabs.map(([id,n])=>`<button class="${state.view===id?'active':''}" onclick="go('${id}')">${n}</button>`).join('') }function go(v){state.view=v;save();render();window.scrollTo({top:0,behavior:'smooth'})}function setEnergy(v){state.energy=v;save();render()}function setMinutes(v){state.minutes=+v;save();render()}function topicOrder(){return [...all].sort((a,b)=>{let x=state.status[a.id]||'pendente',y=state.status[b.id]||'pendente';let rank={pendente:0,estudando:1,feito:3,revisado:4};return (rank[x]-rank[y])||(b.weight-a.weight)||(a.id.localeCompare(b.id))})}function recommended(){return topicOrder().filter(t=>!['feito','revisado'].includes(state.status[t.id])).slice(0,3)}function updateStatus(id,v){state.status[id]=v;save();render()}function mark(id){state.checks[id]=!state.checks[id];save();render()}function task(id,title,desc){return `<div class="task"><label><input type="checkbox" ${state.checks[id]?'checked':''} onchange="mark('${id}')"><div><strong>${title}</strong><span>${desc}</span></div></label></div>`}function dashboard(){let c=counts(),rec=recommended(),d=daysLeft(),pct=Math.round(c.done/c.total*100),mins=state.energy==='baixa'?Math.min(15,state.minutes):state.energy==='media'?Math.min(45,state.minutes):state.minutes;return `<div class="grid"><div class="card"><small>CONTAGEM REGRESSIVA</small><div class="big">${d} dias</div><p class="muted">Prova prevista para 6 de dezembro de 2026</p></div><div class="card"><small>EDITAL EM ANDAMENTO</small><div class="metric">${pct}%</div><div class="bar"><div style="width:${pct}%"></div></div><small>${c.done} de ${c.total} tópicos estudados ou revisados</small></div><div class="card"><small>SEU FOCO HOJE</small><div class="metric">${mins} min</div><p class="muted">Tempo adaptado à sua energia e disponibilidade</p></div></div><div class="card" style="margin-top:14px"><h2>Como você está hoje?</h2><p class="muted">Ajuste o plano sem perder a direção.</p><div class="options">${[['baixa','🪫 Energia baixa'],['media','🌤️ Energia média'],['alta','☀️ Energia boa']].map(([v,n])=>`<button class="${state.energy===v?'active':''}" onclick="setEnergy('${v}')">${n}</button>`).join('')}</div><label for="mins">Quanto tempo você tem disponível?</label><div class="options">${[15,30,60,90,120].map(n=>`<button class="${state.minutes===n?'active':''}" onclick="setMinutes(${n})">${n} min</button>`).join('')}</div><div class="card"><div class="row"><h2>Seu plano de hoje</h2><span class="chip">${mins} minutos</span></div><p class="quote">${quot[new Date().getDate()%quot.length]}</p>${rec.length?`${task('today-study-'+today(),'1. Estudar: '+esc(rec[0].name),esc(rec[0].subject)+' • Gran Cursos • '+Math.max(5,Math.round(mins*.55))+' min')}${task('today-recall-'+today(),'2. Recuperação ativa','Feche o material e explique o assunto sem olhar • '+Math.max(3,Math.round(mins*.2))+' min')}${task('today-questions-'+today(),'3. Questões FCC comentadas','Resolva e analise os erros • '+Math.max(5,Math.round(mins*.25))+' min')}`:'<p>Todos os tópicos do roteiro foram marcados! Confira suas revisões.</p>'}<p class="muted">Você pode concluir uma etapa de cada vez. Os itens marcados permanecem salvos.</p><button class="primary" onclick="go('cronograma')">Ver cronograma completo →</button></div><div class="card"><h2>Prioridades sugeridas</h2>${rec.map(t=>`<div class="task"><strong>${esc(t.subject)}</strong><span>${esc(t.name)}</span></div>`).join('')}<p class="muted">Sugestões automáticas; a ordem definitiva deve seguir o edital e seu desempenho.</p></div>`}function schedule(){let start=new Date();start.setHours(12,0,0,0);let ordered=topicOrder(),base=state.minutes,days=daysLeft();return `<div class="card"><h2>Seu cronograma de 7 dias</h2><p>Distribuição sugerida de acordo com o tempo disponível e com os tópicos ainda pendentes. Prioriza disciplinas de maior peso.</p><div class="note"><strong>Regra do plano:</strong> estudo + recuperação ativa + questões + revisão. Ajuste o tempo em Início; marque o edital para atualizar as prioridades.</div></div>${Array.from({length:Math.min(7,days||7)},(_,i)=>{let dt=new Date(start);dt.setDate(dt.getDate()+i);let ds=dt.toLocaleDateString('en-CA'),t=ordered[i%Math.max(1,ordered.length)]||all[i%all.length],t2=ordered[(i+2)%Math.max(1,ordered.length)]||all[(i+2)%all.length];return `<div class="day ${i===0?'today':''}"><div class="row"><strong>${i===0?'Hoje • ':''}${datefmt(ds)}</strong><span class="chip">${i===6?'Revisão semanal':base+' min'}</span></div>${task('schedule-'+ds+'-1',i===6?'Revisar erros da semana':esc(t.subject)+' — '+esc(t.name),i===6?'Revise anotações e questões erradas':'Gran • '+Math.round(base*.55)+' min')}${task('schedule-'+ds+'-2',i===6?'Mini simulado FCC':esc(t2.subject)+' — '+esc(t2.name),i===6?'Cronometre e corrija os erros':'Questões e revisão • '+Math.round(base*.45)+' min')}</div>`}).join('')}<div class="card"><h2>Como usar este cronograma</h2><p>O plano é uma proposta inicial e não substitui a conferência do edital. Se perder um dia, não precisa compensar tudo: retome o próximo bloco prioritário.</p></div>`}function syllabus(){let c=counts();return `<div class="card"><h2>Edital em checklist</h2><p><strong>${c.done}/${c.total} tópicos</strong> com estudo concluído ou revisão registrada.</p><div class="bar"><div style="width:${Math.round(c.done/c.total*100)}%"></div></div><div class="note"><strong>Importante:</strong> esta lista é um roteiro preliminar de organização, <strong>não uma transcrição integral ou conferida do edital oficial</strong>. Especialmente a legislação municipal precisa ser confrontada com o edital antes de considerá-la completa.</div></div>${subjects.map((s,i)=>{let list=all.filter(t=>t.id.startsWith(i+'-'));let done=list.filter(t=>['feito','revisado'].includes(state.status[t.id])).length;return `<details ${i===0?'open':''}><summary>${esc(s[0])} • ${done}/${list.length} <span class="chip">Peso de referência ${s[1]}</span></summary>${list.map(t=>`<div class="topic"><strong>${esc(t.name)}</strong><select aria-label="Situação de ${esc(t.name)}" onchange="updateStatus('${t.id}',this.value)">${[['pendente','Não comecei'],['estudando','Estudando'],['feito','Estudado'],['revisado','Revisado']].map(([v,n])=>`<option value="${v}" ${(state.status[t.id]||'pendente')===v?'selected':''}>${n}</option>`).join('')}</select></div>`).join('')}</details>`}).join('')}`}
function techniques(){let data=[['Recuperação ativa','Depois de estudar, feche o material e tente explicar o conteúdo com suas próprias palavras. Só então confira o que esqueceu.','Após cada bloco de estudo'],['Revisão espaçada','Reveja o conteúdo em intervalos crescentes. Exemplo inicial: 1, 3, 7 e 14 dias, ajustando conforme seus erros.','Revisões de 5 a 15 minutos'],['Questões com correção','Resolva questões da banca FCC. Analise por que a alternativa correta é correta e por que as demais estão erradas.','Depois da teoria e nos simulados'],['Intercalação de matérias','Alterne disciplinas e tipos de problema ao longo da semana. Evite passar dias inteiros em um único assunto.','No cronograma semanal'],['Blocos de foco','Use blocos de 25 minutos com pausa curta, ou blocos de 5 a 10 minutos em dias de pouca energia.','Quando estiver difícil começar'],['Caderno de erros','Registre o assunto, o motivo do erro e a regra que precisa lembrar. Refaça a questão depois, sem consultar.','Ao corrigir questões'],['Simulados cronometrados','Treine resistência, administração do tempo e revisão de respostas. Registre erros por matéria.','Progressivamente até a prova']];return `<div class="card"><h2>Técnicas que realmente ajudam</h2><p>O aplicativo organiza o método. O estudo do conteúdo e as questões podem ser feitos no Gran.</p></div>${data.map(([t,d,w],i)=>`<details ${i===0?'open':''}><summary>${t}</summary><p>${d}</p><span class="chip">${w}</span></details>`).join('')}<div class="card"><h2>Rotina simples para um bloco de 60 minutos</h2>${task('tech-1-'+today(),'30 min — aprender','Aula ou PDF no Gran, com uma pergunta-guia')}${task('tech-2-'+today(),'10 min — lembrar','Explique sem olhar e identifique lacunas')}${task('tech-3-'+today(),'15 min — praticar','Questões comentadas da FCC')}${task('tech-4-'+today(),'5 min — registrar','Anote erros e programe revisão')}</div>`}function motivation(){let d=daysLeft();return `<div class="card"><h2>Motivação que vira ação</h2><p class="quote">${quot[new Date().getDate()%quot.length]}</p><p>Faltam <strong>${d} dias</strong> para a prova. Você não precisa sentir motivação para começar: pode usar uma ação pequena como ponto de partida.</p><div class="options"><button class="primary" onclick="setEnergy('baixa');go('inicio')">Hoje só consigo o mínimo</button><button onclick="go('cronograma')">Quero seguir o plano</button></div></div><div class="card"><h2>Plano de emergência: 5 minutos</h2>${task('tiny-1-'+today(),'1 minuto — abrir o Gran','Escolha um único tópico do cronograma')}${task('tiny-2-'+today(),'3 minutos — ler ou assistir','Sem tentar terminar tudo')}${task('tiny-3-'+today(),'1 minuto — recordar','Diga uma coisa que aprendeu')}<p class="muted">Se conseguir continuar, ótimo. Se não, a pequena ação ainda conta.</p></div><div class="card"><h2>Meu motivo para continuar</h2><p class="muted">Escreva algo pessoal que queira lembrar nos dias difíceis. Fica salvo apenas neste navegador.</p><textarea id="why" style="width:100%;min-height:110px;background:#26253c;color:white;border:1px solid #55506d;border-radius:12px;padding:12px;font:inherit" placeholder="Por que essa aprovação importa para mim?">${esc(state.notes)}</textarea><p><button onclick="state.notes=$('#why').value;save();this.textContent='Salvo ✓'">Salvar meu motivo</button></p></div>`}function progress(){let c=counts(),done=Object.values(state.checks).filter(Boolean).length;return `<div class="grid"><div class="card"><small>TÓPICOS ESTUDADOS</small><div class="metric">${c.done} / ${c.total}</div></div><div class="card"><small>TÓPICOS REVISADOS</small><div class="metric">${c.review}</div></div><div class="card"><small>ETAPAS CONCLUÍDAS</small><div class="metric">${done}</div></div></div><div class="card" style="margin-top:14px"><h2>Avanço por disciplina</h2>${subjects.map((s,i)=>{let ts=all.filter(t=>t.id.startsWith(i+'-')),n=ts.filter(t=>['feito','revisado'].includes(state.status[t.id])).length;return `<div style="margin:16px 0"><div class="row"><strong>${esc(s[0])}</strong><small>${n}/${ts.length}</small></div><div class="bar"><div style="width:${Math.round(n/ts.length*100)}%"></div></div></div>`}).join('')}</div><div class="card"><h2>Seus dados</h2><p class="muted">O progresso é salvo neste dispositivo/navegador. Se limpar os dados do navegador, ele pode desaparecer.</p><button onclick="exportData()">Exportar backup</button> <button onclick="document.getElementById('importFile').click()">Importar backup</button><input id="importFile" class="hidden" type="file" accept="application/json" onchange="importData(this)"><p><button onclick="if(confirm('Apagar todo o progresso salvo neste navegador?')){localStorage.removeItem(key);location.reload()}" style="color:#ffc3c8">Apagar progresso</button></p></div>`}function exportData(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='manausprev-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||typeof x!=='object'||!x.checks||!x.status)throw Error();state={...state,...x};save();render();alert('Backup importado')}catch(e){alert('Arquivo de backup inválido')}};r.readAsText(f)}function render(){nav();$('#content').innerHTML=({inicio:dashboard,cronograma:schedule,edital:syllabus,tecnicas:techniques,motivacao:motivation,progresso:progress}[state.view]||dashboard)()}render();
</script></body></html>
